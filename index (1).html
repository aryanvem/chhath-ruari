<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chhath at Ruari: A Comic Journey</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a0f2e;--gold:#ffb703;--red:#d7263d;--paper:#fff1c9;--night:#120b2a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--night);color:var(--paper);font-family:Bangers,Impact,"Arial Narrow",sans-serif;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;padding:12px 12px 28px}
.hi{font-family:"Tiro Devanagari Hindi","Noto Sans Devanagari",serif;letter-spacing:0}
.wrap{width:100%;max-width:460px}
.panel{position:relative;width:100%;aspect-ratio:400/560;border:6px solid var(--ink);outline:3px solid var(--paper);box-shadow:8px 8px 0 var(--red);overflow:hidden;background:#000}
.panel svg{display:block;width:100%;height:100%}
.dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(26,15,46,.5) 1.2px,transparent 1.6px);background-size:7px 7px;mix-blend-mode:multiply;opacity:.5}
.fade{animation:fin .6s ease both}
@keyframes fin{from{opacity:0;transform:scale(1.04)}}
.intro{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:20px;text-align:center;background:linear-gradient(transparent 30%,rgba(18,11,42,.85))}
.intro h1{font-weight:400;font-size:clamp(34px,11vw,56px);margin:0;color:var(--gold);text-shadow:3px 3px 0 var(--red),5px 5px 0 var(--ink);line-height:1;transform:rotate(-2deg)}
.intro .hi{font-size:clamp(30px,9vw,44px);color:var(--paper);text-shadow:3px 3px 0 var(--ink);margin:4px 0}
.intro p{margin:6px 0 14px;font-size:18px}
.card{margin-top:14px;background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--gold);padding:10px 14px;font-size:19px;line-height:1.2}
.card b{font-weight:400;font-size:26px;color:var(--red);display:block}
.card .hi{display:block;color:#7a2d00;font-size:17px;margin-top:2px}
.card .lore{display:none;margin-top:8px;padding-top:8px;border-top:3px dashed var(--ink);font-size:17px}
.card.on .lore{display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;font-size:19px;letter-spacing:.06em;background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:3px 3px 0 var(--gold);padding:7px 14px;cursor:pointer;flex:1 1 auto}
button.pri{background:var(--gold)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--gold)}
button:focus-visible,[role=button]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button[disabled]{opacity:.45}
.chips button{font-size:15px;padding:5px 8px;flex:1 1 30%}
.chips button.cur{background:var(--red);color:var(--paper)}
.hot{cursor:pointer}
.hot:hover .tag,.hot:focus .tag{fill:#fff}
.bob{animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.2s ease-in-out infinite alternate}
@keyframes pl{to{transform:scale(1.18)}}
.glow{animation:gl 1.6s ease-in-out infinite alternate}
@keyframes gl{from{opacity:.55}to{opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 24s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.wave{animation:wv 3s linear infinite}
@keyframes wv{to{transform:translateX(-40px)}}
.drift{animation:dr 9s linear infinite}
@keyframes dr{from{transform:translateX(-30px)}to{transform:translateX(430px)}}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:fk .35s ease-in-out infinite alternate}
@keyframes fk{to{transform:scale(.8,1.2) rotate(4deg)}}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:fl 1s ease-in-out infinite alternate}
@keyframes fl{to{transform:skewY(10deg) scaleX(.85)}}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:sw 1.4s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.rise{animation:ri 14s ease-in-out infinite alternate}
@keyframes ri{from{transform:translateY(34px)}to{transform:translateY(0)}}
.set{animation:ri 14s ease-in-out infinite alternate-reverse}
#walker{transition:transform 1.8s ease-in-out}
#cr{position:absolute;inset:44px 10px auto 10px;z-index:6;background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--gold);padding:10px 12px;font-size:16px;line-height:1.25}
#cr[hidden]{display:none}
#cr b{font-weight:400;font-size:22px;color:var(--red);display:block}
#cr input{width:100%;margin:4px 0;font:16px Arial,sans-serif;padding:4px 6px;border:3px solid var(--ink);background:#fff;color:var(--ink)}
#np{position:absolute;left:8px;right:8px;bottom:8px;z-index:5;background:var(--gold);color:var(--ink);border:3px solid var(--ink);padding:2px 8px;font-size:15px;text-align:center}
#np:empty{display:none}
.snd{position:absolute;top:6px;right:6px;z-index:5;display:flex;gap:6px}
.snd button,.snd label{font-family:Bangers,Impact,sans-serif;font-size:14px;letter-spacing:.05em;padding:3px 8px;flex:0 0 auto;border:3px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:2px 2px 0 var(--gold);cursor:pointer;line-height:1.2}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="panel" id="panel"><div id="stage"></div><div class="dots"></div><div id="over"></div><div class="snd"><button id="snd" type="button" aria-label="Toggle music">♪ Off</button><label>My song<input type="file" accept="audio/*" id="mf" hidden></label><button id="cb" type="button">Credits</button></div><div id="cr" hidden><b>Credits</b>Story, comic art and animation: made with Claude (Anthropic).<br>Festival: Chhath Puja, honouring Surya Dev and Chhathi Maiya.<br>Built-in music: an original instrumental generated inside this page.<br><br>Your song (shows on screen while it plays):<input id="ct" placeholder="Song title"><input id="ca" placeholder="Singer / composer / source"></div><div id="np"></div></div>
<div id="ui"></div>
</div>
<script>
